name: Pkl Nix package

on:
  push:
    branches: ["**"]
    tags: ["pkl-nix@*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: 0.31.1
      - uses: cachix/install-nix-action@v31
      - name: Verify release tag
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: sh scripts/release-tag.sh "$TAG"
      - name: Check schemas, Nix rendering and package import
        run: sh scripts/test-package.sh
      - name: Build the publishable Pkl package
        run: sh scripts/package-pkl.sh dist/package
      - uses: actions/upload-artifact@v7
        with:
          name: pkl-nix-package
          path: dist/package/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/pkl-nix@')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: pkl-community/setup-pkl@v0
        with:
          pkl-version: 0.31.1
      - uses: cachix/install-nix-action@v31
      - uses: actions/download-artifact@v8
        with:
          name: pkl-nix-package
          path: dist/package
      - name: Verify tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          sh scripts/release-tag.sh "$TAG"
      - name: Publish Pkl package assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#pkl-nix@}
          gh release create "$TAG" \
            "dist/package/pkl-nix@$version" \
            "dist/package/pkl-nix@$version.sha256" \
            "dist/package/pkl-nix@$version.zip" \
            "dist/package/pkl-nix@$version.zip.sha256" \
            --verify-tag --generate-notes
